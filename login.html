<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Login - Plataforma Escolar</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

  <h2>📚 Plataforma Escolar</h2>

  <input type="text" id="escolaId" placeholder="ID da Escola (ex: ESC_001)">
  <input type="text" id="user" placeholder="Utilizador (admin / matrícula / código)">
  <input type="password" id="pass" placeholder="Senha">

  <button onclick="login()">Entrar</button>

  <p id="msg"></p>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
